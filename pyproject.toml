[project]
name = "agentic-cover-letter-generator"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langgraph-sdk",
    "langchain-anthropic",
    "langchain-core",
    "pydantic",
    "python-dotenv",
    "pypdf",
    "python-docx",
    "fastapi[standard]",
    "httpx",
    "streamlit",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["graph"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
