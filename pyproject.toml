[project]
name = "cover-letter-agent"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "langgraph",
    "langchain-anthropic",
    "python-dotenv",
    "pypdf",
    "python-docx",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["graph"]
